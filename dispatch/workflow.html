<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <title>Workflow | Always Green Turf — Internal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./dispatch.css" />
  <style>
    .backlink { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:.82rem; font-weight:600; margin-bottom:12px; }
    .backlink:hover { color:var(--moss); }
    .wf-tabs { display:flex; gap:26px; border-bottom:1px solid var(--border); margin:18px 0 22px; }
    .wf-tab { padding:10px 2px; border:0; background:none; font:inherit; font-size:.9rem; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; box-shadow:none; }
    .wf-tab:hover { color:var(--text); }
    .wf-tab.active { color:var(--moss); border-bottom-color:var(--moss); }
    .panel { display:none; } .panel.active { display:block; }
    /* switch */
    .switch { position:relative; display:inline-flex; align-items:center; gap:10px; cursor:pointer; }
    .switch input { position:absolute; opacity:0; width:0; height:0; }
    .track { width:44px; height:24px; border-radius:50px; background:#cbd5cc; transition:background .18s; flex:none; position:relative; }
    .track::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .18s; }
    .switch input:checked + .track { background:var(--moss); }
    .switch input:checked + .track::after { transform:translateX(20px); }
    .switch-label { font-size:.82rem; font-weight:700; color:var(--text-2); }
    /* node graph — light canvas that blends into the page */
    .wf-canvas { background-color:transparent; background-image:radial-gradient(#dfe6e0 1px, transparent 0); background-size:20px 20px; border-radius:var(--radius-lg); padding:34px 26px; overflow-x:auto; }
    .wf-flow { display:flex; align-items:flex-start; gap:0; min-width:max-content; }
    .node { display:flex; flex-direction:column; align-items:center; width:112px; flex:none; position:relative; }
    .node::after { content:""; position:absolute; top:26px; left:calc(50% + 26px); width:calc(100% - 52px); height:2px; background:#c7d0c8; }
    .node:last-child::after { display:none; }
    .node-tile { width:52px; height:52px; border-radius:14px; background:#fff; border:1px solid var(--border); display:grid; place-items:center; color:var(--moss); box-shadow:0 4px 12px rgba(20,50,30,.08); }
    .node-tile svg { width:24px; height:24px; }
    .node.trigger .node-tile { background:#fbf3e0; border-color:#e4c988; color:#b8912f; border-radius:16px 16px 16px 5px; }
    .node-label { margin-top:11px; font-size:.68rem; color:var(--text); text-align:center; font-weight:600; line-height:1.25; max-width:104px; }
    .node-sub { font-size:.58rem; color:var(--subtle); margin-top:3px; text-align:center; }
    /* runs */
    .run { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); margin-bottom:12px; overflow:hidden; }
    .run-head { display:flex; align-items:center; gap:14px; padding:14px 18px; cursor:pointer; }
    .run-head:hover { background:var(--panel-2); }
    .run-grow { flex:1; min-width:0; }
    .run-sub { color:var(--muted); font-size:.78rem; margin-top:2px; }
    .run-when { color:var(--muted); font-size:.74rem; font-family:ui-monospace,Menlo,monospace; white-space:nowrap; }
    .chev { transition:transform .18s; color:var(--muted); flex:none; }
    .run.open .chev { transform:rotate(90deg); }
    .steps { display:none; border-top:1px solid var(--border-2); padding:6px 0; background:var(--panel-2); }
    .run.open .steps { display:block; }
    .step { padding:10px 18px; border-bottom:1px solid var(--border-2); }
    .step:last-child { border-bottom:none; }
    .step-head { display:flex; align-items:center; gap:10px; }
    .step-dot { width:9px; height:9px; border-radius:50%; flex:none; }
    .step-dot.success{background:var(--ok);} .step-dot.error{background:var(--danger);} .step-dot.info{background:var(--info);} .step-dot.running{background:var(--warn);}
    .step-name { font-weight:700; font-size:.84rem; color:var(--text); }
    .step-ms { margin-left:auto; font-size:.72rem; color:var(--subtle); font-family:ui-monospace,Menlo,monospace; }
    .io { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
    @media (max-width:720px){ .io { grid-template-columns:1fr; } }
    .io-box { background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .io-label { font-size:.62rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); padding:6px 10px; border-bottom:1px solid var(--border-2); background:var(--panel-2); }
    .io pre { margin:0; padding:10px; font-size:.72rem; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#243b2b; white-space:pre-wrap; word-break:break-word; max-height:280px; overflow:auto; }
    .step-err { margin-top:8px; background:var(--danger-bg); border:1px solid var(--danger-border); color:var(--danger); border-radius:8px; padding:8px 10px; font-size:.78rem; white-space:pre-wrap; }
    .endpoint { font-family:ui-monospace,Menlo,monospace; font-size:.78rem; color:var(--text-2); cursor:pointer; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sb-brand" style="justify-content:center; padding-bottom:22px;"><img src="../logo.webp" alt="Always Green Turf" style="height:40px;" /></div>
      <div class="sb-section-label">Time Off</div>
      <nav class="sb-nav"><a href="/admin/dashboard.html" class="sb-link"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>Time Off Requests</a></nav>
      <div class="sb-section-label">Appointment Dispatch</div>
      <nav class="sb-nav">
        <a href="/dispatch/" class="sb-link"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h12"/></svg>Dispatch Logs</a>
        <a href="/dispatch/reps" class="sb-link"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6 5.87v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M16 3.13a4 4 0 010 7.75M8 11a4 4 0 100-8 4 4 0 000 8z"/></svg>Sales Reps</a>
      </nav>
      <div class="sb-section-label">Workflows</div>
      <nav class="sb-nav">
        <a href="/dispatch/workflows" class="sb-link active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>Workflows</a>
        <a href="/dispatch/runs" class="sb-link"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Executions</a>
      </nav>
      <div class="sb-section-label">Warranty</div>
      <nav class="sb-nav">
        <a href="/dispatch/claims" class="sb-link"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>Warranty Claims</a>
      </nav>
      <div class="sb-footer">
        <div class="sb-user"><div class="sb-avatar" id="userAvatar">J</div><div class="sb-user-info"><div class="sb-user-name" id="userEmail">…</div><div class="subtle">Admin</div></div></div>
        <button id="signOutBtn" class="sb-signout" type="button">Sign out</button>
      </div>
    </aside>
    <main class="main">
      <div class="mobile-bar"><img src="../logo.webp" alt="Always Green Turf" /></div>
      <a href="/dispatch/workflows" class="backlink"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>Workflows</a>
      <div class="page-head">
        <div><h1 id="wfName">Workflow</h1><p id="wfDesc"></p><p class="endpoint" id="wfEndpoint" title="Click to copy"></p></div>
        <div class="head-actions">
          <label class="switch"><input type="checkbox" id="pubToggle"><span class="track"></span><span class="switch-label" id="pubLabel">…</span></label>
        </div>
      </div>
      <div class="wf-tabs">
        <button class="wf-tab active" data-tab="nodes" type="button">Nodes</button>
        <button class="wf-tab" data-tab="exec" type="button">Executions</button>
      </div>
      <div class="panel active" id="panel-nodes"></div>
      <div class="panel" id="panel-exec">
        <div id="execStats" class="stats"></div>
        <div id="execList"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { supabase, requireSession, signOut, fmtPhx } from "./config.js";
    import { WORKFLOWS, ICONS } from "./workflow-defs.js";
    const byId = (id) => document.getElementById(id);
    byId("signOutBtn").addEventListener("click", signOut);
    const esc = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const jshow = (v) => v == null ? "—" : esc(typeof v === "string" ? v : JSON.stringify(v, null, 2));

    const key = new URLSearchParams(location.search).get("wf");
    const wf = WORKFLOWS.find((w) => w.key === key);
    const session = await requireSession(); if (!session) throw new Error("no session");
    byId("userEmail").textContent = session.user.email;
    byId("userAvatar").textContent = (session.user.email || "?").charAt(0).toUpperCase();

    if (!wf) { byId("wfName").textContent = "Workflow not found"; throw new Error("no wf"); }
    byId("wfName").textContent = wf.name;
    byId("wfDesc").textContent = wf.desc;
    const origin = location.origin.replace("://www.", "://");
    const ep = byId("wfEndpoint"); ep.textContent = wf.trigger + "  ·  " + origin + wf.endpoint + "  📋";
    ep.addEventListener("click", () => navigator.clipboard.writeText(origin + wf.endpoint).then(() => { const t = ep.textContent; ep.textContent = "✓ endpoint copied"; setTimeout(() => ep.textContent = t, 1200); }));

    // ── Nodes graph ──
    byId("panel-nodes").innerHTML = `<div class="wf-canvas"><div class="wf-flow">${
      wf.steps.map(([name, ic, sub], i) => `<div class="node${i===0?" trigger":""}"><div class="node-tile"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${ICONS[ic]||ICONS.globe}"/></svg></div><div class="node-label">${name}</div>${sub?`<div class="node-sub">${sub}</div>`:""}</div>`).join("")
    }</div></div>`;

    // ── Tabs ──
    document.querySelectorAll(".wf-tab").forEach((t) => t.addEventListener("click", () => {
      document.querySelectorAll(".wf-tab").forEach((x) => x.classList.remove("active"));
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      t.classList.add("active"); byId("panel-" + t.dataset.tab).classList.add("active");
      if (t.dataset.tab === "exec" && !execLoaded) loadExec();
    }));

    // ── Publish toggle ──
    const toggle = byId("pubToggle"), pubLabel = byId("pubLabel");
    async function loadPublished() {
      const { data } = await supabase.from("workflow_config").select("published").eq("workflow", key).maybeSingle();
      const pub = !data || data.published !== false;
      toggle.checked = pub; pubLabel.textContent = pub ? "Published" : "Unpublished";
    }
    toggle.addEventListener("change", async () => {
      const published = toggle.checked; pubLabel.textContent = "Saving…"; toggle.disabled = true;
      try {
        const { data } = await supabase.auth.getSession();
        const res = await fetch("/api/workflow-toggle", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${data?.session?.access_token}` }, body: JSON.stringify({ workflow: key, published }) });
        if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || "failed");
        pubLabel.textContent = published ? "Published" : "Unpublished";
      } catch (e) { toggle.checked = !published; pubLabel.textContent = !published ? "Published" : "Unpublished"; alert("Could not update: " + e.message); }
      finally { toggle.disabled = false; }
    });

    // ── Executions ──
    let execLoaded = false;
    async function loadExec() {
      execLoaded = true;
      byId("execList").innerHTML = `<div class="empty"><div class="spinner"></div>Loading executions…</div>`;
      const { data, error } = await supabase.from("workflow_runs").select("*").eq("workflow", key).order("created_at", { ascending: false }).limit(100);
      if (error) { byId("execList").innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>${error.message}</div>`; return; }
      const rows = data || [];
      const ok = rows.filter((r) => r.status === "success").length, err = rows.filter((r) => r.status === "error").length;
      byId("execStats").innerHTML = `
        <div class="stat"><div class="stat-label">Runs</div><div class="stat-value">${rows.length}</div></div>
        <div class="stat"><div class="stat-label">Success</div><div class="stat-value" style="color:var(--ok);">${ok}</div></div>
        <div class="stat"><div class="stat-label">Errors</div><div class="stat-value" style="color:${err?"var(--danger)":"var(--muted)"};">${err}</div></div>`;
      if (!rows.length) { byId("execList").innerHTML = `<div class="empty"><div class="empty-icon">📭</div>No runs yet. Trigger the workflow to see executions here.</div>`; return; }
      byId("execList").innerHTML = rows.map((r) => {
        const steps = Array.isArray(r.steps) ? r.steps : [];
        const failed = steps.filter((s) => s.status === "error").length;
        const dur = r.started_at && r.finished_at ? Math.round(new Date(r.finished_at) - new Date(r.started_at)) : null;
        return `<div class="run ${r.status === "error" ? "open" : ""}">
          <div class="run-head">
            <svg class="chev" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></svg>
            <div class="run-grow"><div style="font-weight:800;"><span class="pill ${r.status}">${r.status}</span></div><div class="run-sub">${esc(r.summary||"")} · ${steps.length} steps${failed?` · <span style="color:var(--danger);font-weight:700;">${failed} failed</span>`:""}${dur!=null?` · ${dur}ms`:""}</div></div>
            <div class="run-when">${fmtPhx(r.created_at)}</div>
          </div>
          <div class="steps">${steps.map(stepHtml).join("")}</div>
        </div>`;
      }).join("");
      byId("execList").querySelectorAll(".run-head").forEach((h) => h.addEventListener("click", () => h.parentElement.classList.toggle("open")));
    }
    function stepHtml(s) {
      return `<div class="step">
        <div class="step-head"><span class="step-dot ${s.status}"></span><span class="step-name">${esc(s.name)}</span><span class="step-ms">${s.ms!=null?s.ms+"ms":s.status}</span></div>
        ${s.error?`<div class="step-err">${esc(s.error)}</div>`:""}
        <div class="io"><div class="io-box"><div class="io-label">Input</div><pre>${jshow(s.input)}</pre></div><div class="io-box"><div class="io-label">Output</div><pre>${jshow(s.output)}</pre></div></div>
      </div>`;
    }

    loadPublished();
    if (new URLSearchParams(location.search).get("tab") === "exec") document.querySelector('.wf-tab[data-tab="exec"]').click();
  </script>
</body>
</html>

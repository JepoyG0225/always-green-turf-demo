<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <title>Workflow Runs | Always Green Turf — Internal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./dispatch.css" />
  <style>
    .run { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); margin-bottom:12px; overflow:hidden; }
    .run-head { display:flex; align-items:center; gap:14px; padding:14px 18px; cursor:pointer; }
    .run-head:hover { background:var(--panel-2); }
    .run-title { font-weight:800; color:var(--text); font-size:.92rem; }
    .run-sub { color:var(--muted); font-size:.78rem; margin-top:2px; }
    .run-grow { flex:1; min-width:0; }
    .run-when { color:var(--muted); font-size:.74rem; font-family:ui-monospace,Menlo,monospace; white-space:nowrap; }
    .chev { transition:transform .18s; color:var(--muted); flex:none; }
    .run.open .chev { transform:rotate(90deg); }
    .steps { display:none; border-top:1px solid var(--border-2); padding:6px 0; background:var(--panel-2); }
    .run.open .steps { display:block; }
    .step { padding:10px 18px; border-bottom:1px solid var(--border-2); }
    .step:last-child { border-bottom:none; }
    .step-head { display:flex; align-items:center; gap:10px; }
    .step-dot { width:9px; height:9px; border-radius:50%; flex:none; }
    .step-dot.success { background:var(--ok); } .step-dot.error { background:var(--danger); }
    .step-dot.info { background:var(--info); } .step-dot.running { background:var(--warn); }
    .step-name { font-weight:700; font-size:.84rem; color:var(--text); }
    .step-ms { margin-left:auto; font-size:.72rem; color:var(--subtle); font-family:ui-monospace,Menlo,monospace; }
    .io { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
    @media (max-width:720px){ .io { grid-template-columns:1fr; } }
    .io-box { background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .io-label { font-size:.62rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); padding:6px 10px; border-bottom:1px solid var(--border-2); background:var(--panel-2); }
    .io pre { margin:0; padding:10px; font-size:.72rem; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#243b2b; white-space:pre-wrap; word-break:break-word; max-height:280px; overflow:auto; }
    .step-err { margin-top:8px; background:var(--danger-bg); border:1px solid var(--danger-border); color:var(--danger); border-radius:8px; padding:8px 10px; font-size:.78rem; white-space:pre-wrap; }
    .pill.success{background:var(--ok-bg);color:var(--ok);} .pill.error{background:var(--danger-bg);color:var(--danger);}
    .pill.skipped{background:var(--panel-2);color:var(--muted);} .pill.running{background:var(--warn-bg);color:var(--warn);}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sb-brand" style="justify-content:center; padding-bottom:22px;"><img src="../logo.webp" alt="Always Green Turf" style="height:40px;" /></div>
      <div class="sb-section-label">Time Off</div>
      <nav class="sb-nav">
        <a href="/admin/dashboard.html" class="sb-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Time Off Requests
        </a>
      </nav>
      <div class="sb-section-label">Appointment Dispatch</div>
      <nav class="sb-nav">
        <a href="/dispatch/" class="sb-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h12"/></svg>
          Dispatch Logs
        </a>
        <a href="/dispatch/reps" class="sb-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6 5.87v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M16 3.13a4 4 0 010 7.75M8 11a4 4 0 100-8 4 4 0 000 8z"/></svg>
          Sales Reps
        </a>
      </nav>
      <div class="sb-section-label">Workflows</div>
      <nav class="sb-nav">
        <a href="/dispatch/workflows" class="sb-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Workflows
        </a>
        <a href="/dispatch/runs" class="sb-link active">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          Executions
        </a>
      </nav>
      <div class="sb-section-label">Warranty</div>
      <nav class="sb-nav">
        <a href="/dispatch/claims" class="sb-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          Warranty Claims
        </a>
      </nav>
      <div class="sb-footer">
        <div class="sb-user"><div class="sb-avatar" id="userAvatar">J</div><div class="sb-user-info"><div class="sb-user-name" id="userEmail">…</div><div class="subtle">Admin</div></div></div>
        <button id="signOutBtn" class="sb-signout" type="button">Sign out</button>
      </div>
    </aside>
    <main class="main">
      <div class="mobile-bar"><img src="../logo.webp" alt="Always Green Turf" /><span class="tag">⚡ AGT Admin</span></div>
      <nav class="mobile-tabs">
        <a href="/admin/dashboard.html">Time Off</a>
        <a href="/dispatch/">Dispatch</a>
        <a href="/dispatch/reps">Reps</a>
        <a href="/dispatch/workflows">Workflows</a>
        <a href="/dispatch/runs" class="active">Executions</a>
        <a href="/dispatch/claims">Warranty</a>
      </nav>
      <div class="page-head">
        <div><h1>Workflow Runs</h1><p>Every workflow execution with per-step input &amp; output — newest first.</p></div>
        <div class="head-actions">
          <select id="filter" style="width:auto;"><option value="">All workflows</option></select>
          <button class="btn secondary" id="refreshBtn" type="button">Refresh</button>
        </div>
      </div>
      <div id="stats" class="stats"></div>
      <div id="content"></div>
    </main>
  </div>

  <script type="module">
    import { supabase, requireSession, signOut, fmtPhx } from "./config.js";
    const content = document.getElementById("content"), statsEl = document.getElementById("stats"), filterEl = document.getElementById("filter");
    document.getElementById("signOutBtn").addEventListener("click", signOut);
    document.getElementById("refreshBtn").addEventListener("click", () => load());
    filterEl.addEventListener("change", () => render());
    const session = await requireSession(); if (!session) throw new Error("no session");
    document.getElementById("userEmail").textContent = session.user.email;
    document.getElementById("userAvatar").textContent = (session.user.email || "?").charAt(0).toUpperCase();
    const esc = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const jshow = (v) => v == null ? "—" : esc(typeof v === "string" ? v : JSON.stringify(v, null, 2));
    let RUNS = [];

    async function load() {
      content.innerHTML = `<div class="empty"><div class="spinner"></div>Loading runs…</div>`;
      const { data, error } = await supabase.from("workflow_runs").select("*").order("created_at",{ascending:false}).limit(100);
      if (error) { content.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>${error.message}</div>`; return; }
      RUNS = data || [];
      const wfs = [...new Set(RUNS.map(r=>r.workflow))];
      filterEl.innerHTML = `<option value="">All workflows</option>` + wfs.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join("");
      const wf = new URLSearchParams(location.search).get("wf");
      if (wf) filterEl.value = wf;
      render();
    }
    function render() {
      const f = filterEl.value;
      const rows = f ? RUNS.filter(r=>r.workflow===f) : RUNS;
      const ok = rows.filter(r=>r.status==="success").length, err = rows.filter(r=>r.status==="error").length;
      statsEl.innerHTML = `
        <div class="stat"><div class="stat-label">Runs</div><div class="stat-value">${rows.length}</div><div class="stat-sub">latest 100</div></div>
        <div class="stat"><div class="stat-label">Success</div><div class="stat-value" style="color:var(--ok);">${ok}</div></div>
        <div class="stat"><div class="stat-label">Errors</div><div class="stat-value" style="color:${err?"var(--danger)":"var(--muted)"};">${err}</div></div>`;
      if (!rows.length) { content.innerHTML = `<div class="empty"><div class="empty-icon">📭</div>No runs yet.</div>`; return; }
      content.innerHTML = rows.map((r, i) => {
        const steps = Array.isArray(r.steps) ? r.steps : [];
        const dur = r.started_at && r.finished_at ? Math.round((new Date(r.finished_at)-new Date(r.started_at))) : null;
        return `<div class="run" data-i="${i}">
          <div class="run-head">
            <svg class="chev" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></svg>
            <div class="run-grow"><div class="run-title">${esc(r.workflow)} <span class="pill ${r.status}">${esc(r.status)}</span></div><div class="run-sub">${esc(r.summary||"")} · ${steps.length} steps${dur!=null?` · ${dur}ms`:""}</div></div>
            <div class="run-when">${fmtPhx(r.created_at)}</div>
          </div>
          <div class="steps">${steps.map(stepHtml).join("")}</div>
        </div>`;
      }).join("");
      content.querySelectorAll(".run-head").forEach((h)=>h.addEventListener("click",()=>h.parentElement.classList.toggle("open")));
    }
    function stepHtml(s) {
      return `<div class="step">
        <div class="step-head"><span class="step-dot ${s.status}"></span><span class="step-name">${esc(s.name)}</span><span class="step-ms">${s.ms!=null?s.ms+"ms":s.status}</span></div>
        ${s.error?`<div class="step-err">${esc(s.error)}</div>`:""}
        <div class="io">
          <div class="io-box"><div class="io-label">Input</div><pre>${jshow(s.input)}</pre></div>
          <div class="io-box"><div class="io-label">Output</div><pre>${jshow(s.output)}</pre></div>
        </div>
      </div>`;
    }
    load();
  </script>
</body>
</html>

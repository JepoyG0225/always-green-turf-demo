<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <title>DispatchAI Login | Always Green Turf — Internal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./dispatch.css" />
  <style>
    body { background:linear-gradient(135deg,#f6faf6 0%,#eaf5ea 60%,#f6faf6 100%); display:grid; place-items:center; padding:32px 20px; }
    .login-wrap { width:100%; max-width:420px; }
    .login-brand { text-align:center; margin-bottom:28px; }
    .login-brand img { height:56px; width:auto; margin-bottom:14px; }
    .login-brand .tag {
      display:inline-block; font-size:.62rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
      color:var(--moss); background:var(--mint); padding:5px 12px; border-radius:50px;
    }
    .login-card {
      background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-xl);
      padding:36px 32px; box-shadow:var(--shadow-lg);
    }
    .login-card h1 { font-size:1.4rem; font-weight:800; letter-spacing:-.01em; text-align:center; }
    .login-card p.sub { text-align:center; color:var(--muted); font-size:.86rem; margin-top:6px; }
    .login-card label { margin-top:16px; }
    #loginBtn { width:100%; margin-top:22px; padding:13px; font-size:.9rem; justify-content:center; }
    .footnote { text-align:center; margin-top:20px; color:var(--subtle); font-size:.75rem; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <img src="../logo.webp" alt="Always Green Turf AZ" />
      <div class="tag">⚡ DispatchAI Admin</div>
    </div>
    <div class="login-card">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to manage dispatch and sales reps.</p>
      <form id="loginForm" novalidate>
        <label for="email">Work email</label>
        <input id="email" type="email" autocomplete="username" required placeholder="you@alwaysgreenturfaz.com" />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
        <button id="loginBtn" type="submit">Sign in</button>
        <div class="error" id="errorBox"></div>
      </form>
      <p class="footnote">Trouble signing in? Contact your administrator.</p>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./config.js";
    const byId = (id) => document.getElementById(id);
    const errBox = byId("errorBox");
    const showError = (m) => { errBox.textContent = m; errBox.classList.add("show"); };

    (async () => {
      const { data } = await supabase.auth.getSession();
      if (data?.session) window.location.replace("/dispatch/");
    })();

    byId("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.classList.remove("show");
      const email = byId("email").value.trim(), password = byId("password").value;
      if (!email || !password) { showError("Email and password are required."); return; }
      const btn = byId("loginBtn"); btn.disabled = true; const t = btn.textContent; btn.textContent = "Signing in…";
      try {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.replace("/dispatch/");
      } catch (err) {
        showError(err?.message || "Sign-in failed. Check your credentials.");
      } finally { btn.disabled = false; btn.textContent = t; }
    });
  </script>
</body>
</html>

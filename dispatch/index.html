<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <title>Dispatch Logs | Always Green Turf — Internal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./dispatch.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sb-brand">
        <img src="../logo.webp" alt="Always Green Turf" />
      </div>
      <div class="sb-brand" style="padding:0 8px 22px;">
        <span class="tag">⚡ DispatchAI</span>
      </div>

      <div class="sb-section-label">Main</div>
      <nav class="sb-nav">
        <a href="/dispatch/" class="sb-link active">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h12"/></svg>
          Dispatch Logs
        </a>
        <a href="/dispatch/reps" class="sb-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6 5.87v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M16 3.13a4 4 0 010 7.75M8 11a4 4 0 100-8 4 4 0 000 8z"/></svg>
          Sales Reps
        </a>
        <a href="/dispatch/runs" class="sb-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Workflow Runs
        </a>
      </nav>

      <div class="sb-footer">
        <div class="sb-user">
          <div class="sb-avatar" id="userAvatar">J</div>
          <div class="sb-user-info">
            <div class="sb-user-name" id="userEmail">…</div>
            <div class="subtle">Admin</div>
          </div>
        </div>
        <button id="signOutBtn" class="sb-signout" type="button">Sign out</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <!-- Mobile top bar -->
      <div class="mobile-bar">
        <img src="../logo.webp" alt="Always Green Turf" />
        <span class="tag">⚡ DispatchAI</span>
      </div>
      <nav class="mobile-tabs">
        <a href="/dispatch/" class="active">Dispatch Logs</a>
        <a href="/dispatch/reps">Sales Reps</a>
        <a href="/dispatch/runs">Workflow Runs</a>
      </nav>

      <div class="page-head">
        <div>
          <h1>Dispatch Logs</h1>
          <p>Every lead the CRM sent to <span class="mono">/api/dispatch</span> and what the engine did with it — newest first.</p>
        </div>
        <div class="head-actions">
          <button class="btn secondary" id="refreshBtn" type="button">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v6h6M20 20v-6h-6M20 8a8 8 0 10-1.29 8.31L20 14"/></svg>
            Refresh
          </button>
          <button class="btn danger" id="clearAllBtn" type="button">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.87 12.14A2 2 0 0116.14 21H7.86a2 2 0 01-1.99-1.86L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3M4 7h16"/></svg>
            Clear all
          </button>
        </div>
      </div>

      <div id="configWarn" class="config-warn" style="display:none;"></div>
      <div id="stats" class="stats"></div>
      <div id="content"></div>
    </main>
  </div>

  <script type="module">
    import { supabase, requireSession, signOut, fmtPhx, SUPABASE_URL } from "./config.js";

    const stats = document.getElementById("stats");
    const content = document.getElementById("content");
    document.getElementById("signOutBtn").addEventListener("click", signOut);
    document.getElementById("refreshBtn").addEventListener("click", () => load());

    async function deleteLogs(ids, all = false) {
      const msg = all
        ? "Delete ALL dispatch logs? This can't be undone."
        : "Delete this log entry? This can't be undone.";
      if (!confirm(msg)) return;
      const { data } = await supabase.auth.getSession();
      const token = data?.session?.access_token;
      if (!token) { alert("Session expired — please sign in again."); window.location.replace("/dispatch/login"); return; }
      try {
        const res = await fetch("/api/logs-delete", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify(all ? { all: true } : { ids }),
        });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(out.error || `HTTP ${res.status}`);
        load();
      } catch (e) { alert("Delete failed: " + e.message); }
    }
    document.getElementById("clearAllBtn").addEventListener("click", () => deleteLogs([], true));

    if (SUPABASE_URL.includes("YOUR-PROJECT")) {
      const w = document.getElementById("configWarn");
      w.style.display = "block";
      w.textContent = "⚠ Supabase isn't configured yet — set SUPABASE_URL and SUPABASE_ANON_KEY in dispatch/config.js.";
    }

    const session = await requireSession();
    if (!session) throw new Error("no session");
    document.getElementById("userEmail").textContent = session.user.email;
    document.getElementById("userAvatar").textContent = (session.user.email || "?").charAt(0).toUpperCase();

    async function load() {
      content.innerHTML = `<div class="empty"><div class="empty-icon">⏳</div>Loading dispatch logs…</div>`;
      stats.innerHTML = "";
      const { data, error } = await supabase
        .from("dispatch_logs")
        .select("id, created_at, status, lead_name, lead_address, chosen_rep_name, drive_minutes, appointment_start, ghl_assigned_id, chosen_rep_id, remarks, memory_hit")
        .order("created_at", { ascending: false })
        .limit(100);

      if (error) {
        content.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>Could not load logs: ${error.message}</div>`;
        return;
      }
      if (!data.length) {
        content.innerHTML = `
          <div class="empty">
            <div class="empty-icon">📭</div>
            <div style="font-weight:700; color:var(--text); margin-bottom:6px;">No dispatches yet</div>
            <div>Point your GHL webhook at <span class="mono">/api/dispatch</span> to see runs here.</div>
          </div>`;
        return;
      }

      // Stats — dispatches in this batch (last 100)
      const total = data.length;
      const booked = data.filter((r) => r.status === "booked").length;
      const rebook = data.filter((r) => r.memory_hit).length;
      const errors = data.filter((r) => r.status === "error").length;
      const successPct = total ? Math.round((booked / total) * 100) : 0;
      stats.innerHTML = `
        <div class="stat"><div class="stat-label">Recent dispatches</div><div class="stat-value">${total}</div><div class="stat-sub">latest 100 shown</div></div>
        <div class="stat"><div class="stat-label">Booked</div><div class="stat-value" style="color:var(--ok);">${booked}</div><div class="stat-sub">${successPct}% success</div></div>
        <div class="stat"><div class="stat-label">Repeat addresses</div><div class="stat-value">${rebook}</div><div class="stat-sub">memory hits</div></div>
        <div class="stat"><div class="stat-label">Errors</div><div class="stat-value" style="color:${errors ? "var(--danger)" : "var(--muted)"};">${errors}</div><div class="stat-sub">${errors ? "needs review" : "all clear"}</div></div>
      `;

      const rows = data.map((r) => {
        const mismatch = r.chosen_rep_id && r.ghl_assigned_id && r.chosen_rep_id !== r.ghl_assigned_id;
        const avatar = (r.chosen_rep_name || "—").charAt(0).toUpperCase();
        return `
          <tr>
            <td class="mono muted" style="white-space:nowrap;">${fmtPhx(r.created_at)}</td>
            <td>
              <div style="font-weight:700;">${r.lead_name || "—"}${r.memory_hit ? ` <span class="pill memory_locked">Repeat</span>` : ""}</div>
              <div class="muted" style="font-size:.72rem; margin-top:2px;">${r.lead_address || ""}</div>
            </td>
            <td><span class="pill ${r.status}">${r.status.replace(/_/g, " ")}</span></td>
            <td>
              ${r.chosen_rep_name ? `
                <div class="flex">
                  <div class="rep-avatar" style="width:28px;height:28px;font-size:.72rem;">${avatar}</div>
                  <div>
                    <div style="font-weight:600;">${r.chosen_rep_name}</div>
                    ${mismatch ? `<div><span class="pill warn" title="GHL reassigned this appointment">GHL override</span></div>` : ""}
                  </div>
                </div>` : "—"}
            </td>
            <td class="mono">${r.drive_minutes != null ? r.drive_minutes + "m" : "—"}</td>
            <td class="mono muted" style="white-space:nowrap;">${fmtPhx(r.appointment_start)}</td>
            <td style="text-align:right;">
              <button type="button" class="icon-btn row-del" data-del="${r.id}" title="Delete this log"
                style="background:none;border:0;cursor:pointer;color:var(--subtle);padding:4px;border-radius:6px;">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.87 12.14A2 2 0 0116.14 21H7.86a2 2 0 01-1.99-1.86L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3M4 7h16"/></svg>
              </button>
            </td>
          </tr>`;
      }).join("");

      content.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>When</th><th>Lead</th><th>Status</th><th>Rep</th><th>Drive</th><th>Appointment</th><th></th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;

      content.querySelectorAll(".row-del").forEach((b) => {
        b.addEventListener("mouseenter", () => { b.style.color = "var(--danger)"; b.style.background = "var(--danger-bg)"; });
        b.addEventListener("mouseleave", () => { b.style.color = "var(--subtle)"; b.style.background = "none"; });
        b.addEventListener("click", () => deleteLogs([b.dataset.del]));
      });
    }
    load();
  </script>
</body>
</html>
